name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t liner-notes:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 liner-notes:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/ >/dev/null && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/demo | grep -q friend_key
      - if: failure()
        run: docker logs app
